name: JustWatch API Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install simple-justwatch-python-api httpx -r requirements.txt
      - run: python scripts/debug_justwatch.py
