name: Notify

on:
  repository_dispatch:
    types: [run-notify, init-read, test-notify]

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run script for ${{ github.event.action }}
        env:
          DISCORD_WEBHOOK_NETFLIX: ${{ secrets.DISCORD_WEBHOOK_NETFLIX }}
          DISCORD_WEBHOOK_PRIME: ${{ secrets.DISCORD_WEBHOOK_PRIME }}
        run: |
          case "${{ github.event.action }}" in
            run-notify)
              python main.py
              ;;
            init-read)
              python init_read.py
              ;;
            test-notify)
              python test_notify.py
              ;;
            *)
              echo "Unknown event_type: ${{ github.event.action }}"
              exit 1
              ;;
          esac

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "Update notification state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
