name: Notify

on:
  repository_dispatch:
    types: [run-notify, init-read, test-notify]
  workflow_dispatch:
    inputs:
      event_type:
        description: "run-notify / init-read / test-notify"
        required: true
        default: "test-notify"
        type: choice
        options:
          - run-notify
          - init-read
          - test-notify

permissions:
  contents: write

# state/*.json は「通知済みかどうか」の唯一の記録なので、実行が重なると
# 両方が同じstateを読んで同じ新着を二重通知し、後からpushした側が弾かれる。
# 直列化して必ず1実行ずつにする（cancel-in-progressにはしない。途中で
# 止めるとキューの送信途中でstateが未保存のまま失われるため）。
concurrency:
  group: notify-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # 取得のリトライ待ちなどで最悪でも数分。これを超えたら異常なので打ち切る。
    timeout-minutes: 15
    env:
      # これが無いとPythonのprintがブロックバッファリングされ、実行中はログが
      # 一切流れない（数分かかったとき「固まった」ようにしか見えない）。
      PYTHONUNBUFFERED: "1"
    steps:
      # v4/v5はNode.js 20向けで、ランナー側で非推奨警告が出ている（Node 20は
      # 廃止予定）。Node.js 24対応のメジャーバージョンを使う。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run script
        env:
          DISCORD_WEBHOOK_NETFLIX: ${{ secrets.DISCORD_WEBHOOK_NETFLIX }}
          DISCORD_WEBHOOK_PRIME: ${{ secrets.DISCORD_WEBHOOK_PRIME }}
          EVENT_TYPE: ${{ github.event.action || github.event.inputs.event_type }}
        run: |
          echo "event_type: $EVENT_TYPE"
          case "$EVENT_TYPE" in
            run-notify)
              python main.py
              ;;
            init-read)
              python init_read.py
              ;;
            test-notify)
              python test_notify.py
              ;;
            *)
              echo "Unknown event_type: $EVENT_TYPE"
              exit 1
              ;;
          esac

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "No state changes to commit."
            exit 0
          fi
          git add state/
          git commit -m "Update notification state [skip ci]"
          # pushが弾かれたままだと「通知済み」の記録が消えて次回に二重通知が出る。
          # 他のコミットが入っていた場合に備えてrebaseしてから数回リトライする。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "state pushed (attempt $attempt)"
              exit 0
            fi
            echo "push failed (attempt $attempt). rebasing and retrying..."
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push state changes after 5 attempts."
          exit 1
